[project]
name = "py-apx"
version = "0.5.0a2"
description = "A framework for sending AUTOSAR signal data to non-AUTOSAR applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cfile >=0.4.0"
]

[project.optional-dependencies]
dev = [
    "build",
    "flake8",
    "pylint",
    "twine",
]
docs = [
    "furo",
    "myst-parser",
    "sphinx",
    "sphinx-autobuild",
    "sphinxcontrib-mermaid",
]

[build-system]
requires = ["setuptools","wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/cogu/py-apx"
Issues = "https://github.com/cogu/py-apx/issues"
